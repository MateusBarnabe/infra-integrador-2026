openapi: 3.1.0
info:
  title: Produtos e Serviços
  version: 0.3.0
  summary: Catálogo e precificação manual do módulo produtos.
  description: 'Contrato da Fase 1: catálogo, resumos, busca e precificação manual no mesmo módulo.

    JWT validado localmente. Tenant do claim tenant_id; com sub svc:, exigir X-Tenant-Id e auditar clientId (Contrato
    §9.2). Header ignorado em token de usuário. Outro tenant retorna 404.

    Cada permissão é verificada no back-end, sem hierarquia implícita. Acesso ao menu não é pré-requisito da API.

    Dinheiro BRL com 2 casas; percentual/fator com 4. Decimais são strings, sem arredondamento silencioso. Excesso
    de casas: 400/PRECISAO_EXCEDIDA.

    Produtos fornece limites manuais. CRM/Propostas alerta abaixo do mínimo, aplica quantidade mínima e aprova desconto
    fora da política; Contratos copia os valores pactuados na assinatura. Inativos não entram em vendas novas. Nenhum
    item é excluído.

    Periodicidades e fluxo comercial devem ser revisados pelos consumidores. Implantação e mensalidade são dois
    itens. Não há cálculo automático nem publicação de eventos neste contrato.'
  license:
    name: Uso acadêmico — Projeto Integrador 2026
    identifier: LicenseRef-Academico
servers:
- url: http://localhost:8080
  description: Pelo gateway
- url: http://produtos:8083
  description: Direto, entre serviços; consumidor configura PRODUTOS_BASE_URL e timeout de 3 segundos.
tags:
- name: itens
  description: Cadastro e leitura compartilhada
- name: precificacao
  description: Valores manuais restritos
- name: auxiliares
  description: Fabricantes e distribuidores locais
- name: saude
  description: Disponibilidade
security:
- bearerJwt: []
paths:
  /api/produtos/itens:
    get:
      tags:
      - itens
      operationId: listarProdutos
      summary: Listar itens do tenant
      description: Exige `produtos.item.ver`. q pesquisa SKU e nome; sem filtro ativo, inclui ativos e inativos.
        Sem dados sensíveis.
      x-permissao: produtos.item.ver
      parameters:
      - $ref: '#/components/parameters/TenantServico'
      - $ref: '#/components/parameters/Pagina'
      - name: tamanho
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: ordenar
        in: query
        description: Desempate por id.
        schema:
          type: string
          enum:
          - nome,asc
          - nome,desc
          default: nome,asc
      - name: q
        in: query
        schema:
          type: string
      - name: categoria
        in: query
        schema:
          $ref: '#/components/schemas/Categoria'
      - name: fabricanteId
        in: query
        schema: &id001
          type: string
          format: uuid
      - name: distribuidorId
        in: query
        schema: *id001
      - name: ativo
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/PaginaItens'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
    post:
      tags:
      - itens
      operationId: criarProduto
      summary: Criar item sem precificação
      description: Exige `produtos.item.criar`. Preço e demais valores começam null. Unicidade de SKU garantida
        sob concorrência.
      x-permissao: produtos.item.criar
      parameters:
      - $ref: '#/components/parameters/TenantServico'
      responses:
        '201':
          description: Operação concluída
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/Item'
          headers:
            Location:
              description: URI do recurso criado
              schema:
                type: string
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '409':
          $ref: '#/components/responses/SkuDuplicado'
        '422':
          $ref: '#/components/responses/RegraViolada'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoItem'
  /api/produtos/itens/{id}:
    get:
      tags:
      - itens
      operationId: verProduto
      summary: Consultar cadastro do item
      description: 'Exige `produtos.item.ver`. '
      x-permissao: produtos.item.ver
      parameters:
      - $ref: '#/components/parameters/TenantServico'
      - &id002
        $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    patch:
      tags:
      - itens
      operationId: editarProduto
      summary: Editar ou inativar item
      description: Exige `produtos.item.editar`. Sem exclusão física ou lógica. Campos de precificação são rejeitados.
      x-permissao: produtos.item.editar
      parameters:
      - $ref: '#/components/parameters/TenantServico'
      - *id002
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/SkuDuplicado'
        '422':
          $ref: '#/components/responses/RegraViolada'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditarItem'
  /api/produtos/itens/{id}/resumo:
    get:
      tags:
      - itens
      operationId: resumirProduto
      summary: Consultar resumo fraco
      description: Exige `produtos.item.ver_resumo`. Retorna inclusive inativos. Não exige produtos.acessar ou item.ver.
      x-permissao: produtos.item.ver_resumo
      parameters:
      - $ref: '#/components/parameters/TenantServico'
      - *id002
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/ResumoItem'
              example:
                success: true
                data: &id003
                  id: 5c2d9e1a-0f3b-4b7e-9a6d-1e2f3a4b5c6d
                  sku: BKP-001
                  nome: Licença de backup
                  unidade: LICENCA
                  periodicidade: MENSAL
                  quantidadeMinima: '1'
                  ativo: true
                  casasDecimaisQuantidade: 0
                  moeda: BRL
                  precoVenda: '150.00'
                  precoMinimo: '120.00'
                  descontoMaximo: '10.0000'
                message: null
                errors: []
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /api/produtos/itens/resumo:
    get:
      tags:
      - itens
      operationId: resumirProdutosEmLote
      summary: Consultar até 100 itens por ID
      description: Exige `produtos.item.ver_resumo`. Sem paginação adicional. Ordem solicitada; inexistentes e alheios
        em idsNaoEncontrados, sem distinção. IDs repetidos, inválidos, vazios ou mais de 100 retornam 400. Resolver
        rota literal antes de /itens/{id}.
      x-permissao: produtos.item.ver_resumo
      parameters:
      - $ref: '#/components/parameters/TenantServico'
      - name: ids
        in: query
        required: true
        style: form
        explode: false
        schema:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: *id001
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/LoteResumos'
              example:
                success: true
                data:
                  itens:
                  - *id003
                  idsNaoEncontrados: []
                message: null
                errors: []
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /api/produtos/busca:
    get:
      tags:
      - itens
      operationId: buscarProdutos
      summary: Busca global por SKU e nome
      description: Exige `produtos.item.ver_resumo`. Somente ativos; título, subtítulo e rota da casca. Tela de
        destino oferece resumo com permissão fraca, sem exigir menu. Sem valores sensíveis.
      x-permissao: produtos.item.ver_resumo
      parameters:
      - $ref: '#/components/parameters/TenantServico'
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          pattern: \S
      - $ref: '#/components/parameters/Pagina'
      - name: tamanho
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 5
          default: 5
      - name: ordenar
        in: query
        description: Desempate por id.
        schema:
          type: string
          enum:
          - nome,asc
          - nome,desc
          default: nome,asc
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/PaginaBusca'
              example:
                success: true
                data:
                  itens:
                  - id: 5c2d9e1a-0f3b-4b7e-9a6d-1e2f3a4b5c6d
                    titulo: Licença de backup
                    subtitulo: BKP-001 · LICENCA · MENSAL
                    rota: /produtos/itens/5c2d9e1a-0f3b-4b7e-9a6d-1e2f3a4b5c6d
                  pagina: 0
                  tamanho: 5
                  total: 1
                message: null
                errors: []
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /api/produtos/itens/{id}/precificacao:
