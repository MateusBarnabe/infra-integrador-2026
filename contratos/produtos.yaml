      operationId: editarFabricante
      summary: Editar ou inativar fabricante
      description: Exige `produtos.item.editar`. Preserva vínculos anteriores; sem DELETE.
      x-permissao: produtos.item.editar
      parameters:
      - $ref: '#/components/parameters/TenantServico'
      - *id002
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/Auxiliar'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
      requestBody:
        required: true
        content:
          application/json:
