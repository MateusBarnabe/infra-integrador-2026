          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditarAuxiliar'
  /api/produtos/health:
    get:
      tags:
      - saude
      operationId: saudeProdutos
      summary: Verificar serviço e conexão ao banco
      security: []
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/Saude'
              example:
                success: true
                data:
                  status: UP
                message: null
                errors: []
        '503':
          description: Banco indisponível
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - properties:
                    success:
                      const: false
                    data:
                      $ref: '#/components/schemas/Saude'
              example:
                success: false
                data:
                  status: DOWN
                message: Serviço indisponível.
                errors: []
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Pagina:
      name: pagina
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Id:
      name: id
      in: path
      required: true
      schema: *id001
    TenantServico:
      name: X-Tenant-Id
      in: header
      required: false
      description: Obrigatório apenas com sub svc:. Ignorado com token de usuário. Serviço sem tenant válido recebe
        400. Auditar origem.
      schema: *id001
  responses:
    DadosInvalidos:
      description: Dados inválidos; inclui PRECISAO_EXCEDIDA e TIPO_VALOR_INCONSISTENTE.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Envelope'
            - properties:
                success:
                  const: false
                data:
                  type: 'null'
          example:
            success: false
            data: null
            message: Dados inválidos; inclui PRECISAO_EXCEDIDA e TIPO_VALOR_INCONSISTENTE.
            errors:
            - campo: requisicao
              codigo: CAMPO_INVALIDO
              detalhe: Dados inválidos; inclui PRECISAO_EXCEDIDA e TIPO_VALOR_INCONSISTENTE.
    NaoAutenticado:
      description: Token ausente, inválido ou expirado.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Envelope'
            - properties:
                success:
                  const: false
                data:
                  type: 'null'
          example:
            success: false
            data: null
            message: Token ausente, inválido ou expirado.
            errors:
            - campo: requisicao
              codigo: NAO_AUTENTICADO
              detalhe: Token ausente, inválido ou expirado.
    SemPermissao:
      description: Permissão ausente.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Envelope'
            - properties:
                success:
                  const: false
                data:
                  type: 'null'
          example:
            success: false
            data: null
            message: Permissão ausente.
            errors:
            - campo: requisicao
              codigo: SEM_PERMISSAO
              detalhe: Permissão ausente.
    NaoEncontrado:
      description: Não existe ou pertence a outro tenant.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Envelope'
            - properties:
                success:
                  const: false
                data:
                  type: 'null'
          example:
            success: false
            data: null
            message: Não existe ou pertence a outro tenant.
            errors:
            - campo: requisicao
              codigo: NAO_ENCONTRADO
              detalhe: Não existe ou pertence a outro tenant.
    SkuDuplicado:
      description: SKU já cadastrado no tenant, inclusive inativo.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Envelope'
            - properties:
                success:
                  const: false
                data:
                  type: 'null'
          example:
            success: false
            data: null
            message: SKU já cadastrado no tenant, inclusive inativo.
            errors:
            - campo: sku
              codigo: SKU_DUPLICADO
              detalhe: SKU já cadastrado no tenant, inclusive inativo.
    RegraViolada:
      description: Quantidade mínima não positiva, desconto máximo fora de 0 a 100 ou referência local inativa.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Envelope'
            - properties:
                success:
                  const: false
                data:
                  type: 'null'
          example:
            success: false
            data: null
            message: Quantidade mínima não positiva, desconto máximo fora de 0 a 100 ou referência local inativa.
            errors:
            - campo: requisicao
              codigo: REGRA_VIOLADA
              detalhe: Quantidade mínima não positiva, desconto máximo fora de 0 a 100 ou referência local inativa.
  schemas:
    Envelope:
      type: object
      required:
      - success
      - data
      - message
      - errors
      properties:
        success:
          type: boolean
        data: {}
        message:
          type:
          - string
          - 'null'
        errors:
          type: array
          items:
            type: object
            required:
            - campo
            - codigo
            - detalhe
            properties:
              campo:
                type: string
              codigo:
                type: string
              detalhe:
                type: string
    Dinheiro:
      type:
      - string
      - 'null'
      pattern: ^-?\d{1,13}(?:\.\d{1,2})?$
    NumeroQuatroCasas:
      type:
      - string
      - 'null'
      pattern: ^-?\d{1,11}(?:\.\d{1,4})?$
    Unidade:
      type: string
      enum:
      - USUARIO
      - LICENCA
      - ENDPOINT
      - SERVIDOR
      - VM
      - GB
      - TB
      - CAIXA_POSTAL
      - DOMINIO
      - HORA
      - UNIDADE
    Periodicidade:
      type: string
      enum:
      - UNICA
      - MENSAL
      - TRIMESTRAL
      - SEMESTRAL
      - ANUAL
    Categoria:
      type: string
      enum:
      - SOFTWARE
      - LICENÇA
      - SERVIÇO
      - PROJETO
      - CONSULTORIA
      - BACKUP
      - ARMAZENAMENTO
      - CLOUD
      - SEGURANÇA
      - ANTIVÍRUS
      - EDR
      - XDR
      - MICROSOFT 365
      - GOOGLE WORKSPACE
      - SUPORTE
      - OUTROS
    NovoItem:
      type: object
      additionalProperties: false
      required:
      - sku
      - nome
      - categoria
      - unidade
      - periodicidade
      - quantidadeMinima
      properties: &id005
        sku: &id006
          type: string
          minLength: 1
          description: Digitado; trim e unicidade case-insensitive por tenant, incluindo inativos.
        nome: &id007
          type: string
          minLength: 1
        fabricanteId: &id004
          type:
          - string
          - 'null'
          format: uuid
        distribuidorId: *id004
        categoria: &id012
          $ref: '#/components/schemas/Categoria'
        descricao: &id013
          type:
          - string
          - 'null'
        unidade: &id008
          $ref: '#/components/schemas/Unidade'
        periodicidade: &id009
          $ref: '#/components/schemas/Periodicidade'
        quantidadeMinima: &id010
          type: string
          pattern: ^-?\d{1,11}(?:\.\d{1,4})?$
        ativo: &id011
          type: boolean
          default: true
      description: Quantidade mínima maior que zero; inteiros exceto GB, TB e HORA (4 casas). Referências auxiliares
        do mesmo tenant e ativas. Sem valores de precificação.
    EditarItem:
      type: object
      additionalProperties: false
      required: []
      properties: *id005
      minProperties: 1
      description: Omitido permanece intacto; null somente nos campos opcionais. Mudança de unidade valida o mínimo.
        Inativar preserva resumos. Não recebe precificação.
    ResumoItem:
      type: object
      additionalProperties: false
      required:
      - id
      - sku
      - nome
      - unidade
      - periodicidade
      - quantidadeMinima
      - ativo
      - casasDecimaisQuantidade
      - moeda
      - precoVenda
      - precoMinimo
      - descontoMaximo
      properties:
        id: *id001
        sku: *id006
        nome: *id007
        unidade: *id008
        periodicidade: *id009
        quantidadeMinima: *id010
        ativo: *id011
        casasDecimaisQuantidade: &id014
          type: integer
          enum:
          - 0
          - 4
        moeda: &id015
          const: BRL
          type: string
        precoVenda: &id016
          $ref: '#/components/schemas/Dinheiro'
        precoMinimo: &id017
          $ref: '#/components/schemas/Dinheiro'
        descontoMaximo: &id018
          $ref: '#/components/schemas/NumeroQuatroCasas'
      description: Projeção fraca, sem custo, markup, margem, impostos ou comissão. Limite nulo é política não cadastrada,
        nunca aprovação automática. Preço nulo não equivale a zero. Desconto máximo de 0 a 100.
    Item:
      type: object
      additionalProperties: false
      required:
      - sku
      - nome
      - fabricanteId
      - distribuidorId
      - categoria
      - descricao
      - unidade
      - periodicidade
      - quantidadeMinima
      - ativo
      - id
      - casasDecimaisQuantidade
      - moeda
      - precoVenda
      - precoMinimo
      - descontoMaximo
      - criadoEm
      - atualizadoEm
      properties:
        sku: *id006
        nome: *id007
        fabricanteId: *id004
        distribuidorId: *id004
        categoria: *id012
        descricao: *id013
        unidade: *id008
        periodicidade: *id009
        quantidadeMinima: *id010
        ativo: *id011
        id: *id001
        casasDecimaisQuantidade: *id014
        moeda: *id015
        precoVenda: *id016
        precoMinimo: *id017
        descontoMaximo: *id018
        criadoEm:
          type: string
          format: date-time
        atualizadoEm:
          type: string
          format: date-time
    LoteResumos:
      type: object
      additionalProperties: false
      required:
      - itens
      - idsNaoEncontrados
      properties:
        itens:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ResumoItem'
        idsNaoEncontrados:
          type: array
          maxItems: 100
          items: *id001
    ResultadoBusca:
      type: object
      additionalProperties: false
      required:
      - id
      - titulo
      - subtitulo
      - rota
      properties:
        id: *id001
        titulo:
          type: string
        subtitulo:
          type: string
        rota:
          type: string
          pattern: ^/produtos/itens/[0-9a-fA-F-]+$
    Precificacao:
      type: object
      additionalProperties: false
      required:
      - moeda
      - precoVenda
      - precoMinimo
      - descontoMaximo
      - custo
      - markupValor
      - markupTipo
      - margem
      - impostosValor
      - impostosTipo
      - comissaoValor
      - comissaoTipo
      properties:
        moeda:
          type: string
          const: BRL
        precoVenda:
          $ref: '#/components/schemas/Dinheiro'
        precoMinimo:
          $ref: '#/components/schemas/Dinheiro'
        descontoMaximo:
          $ref: '#/components/schemas/NumeroQuatroCasas'
        custo:
          $ref: '#/components/schemas/Dinheiro'
        markupValor:
          $ref: '#/components/schemas/NumeroQuatroCasas'
        markupTipo:
          type:
          - string
          - 'null'
          enum:
          - PERCENTUAL
          - FATOR
          - null
        margem:
          $ref: '#/components/schemas/NumeroQuatroCasas'
        impostosValor:
          $ref: '#/components/schemas/NumeroQuatroCasas'
        impostosTipo:
          type:
          - string
          - 'null'
          enum:
          - PERCENTUAL
          - VALOR
          - null
        comissaoValor:
          $ref: '#/components/schemas/NumeroQuatroCasas'
        comissaoTipo:
          type:
          - string
          - 'null'
          enum:
          - PERCENTUAL
          - VALOR
          - null
      description: PUT completo, chaves obrigatórias, valores nulos permitidos. Sem cálculo ou coerência matemática
        entre campos. Desconto máximo entre 0 e 100 (422 fora da faixa). Cada par tipo/valor é ambos null ou ambos
        preenchidos (400/TIPO_VALOR_INCONSISTENTE). Tipos VALOR usam 2 casas, PERCENTUAL e FATOR usam 4.
      allOf:
      - oneOf:
        - properties:
            markupValor:
              type: 'null'
            markupTipo:
              type: 'null'
        - properties:
            markupValor:
              type: string
            markupTipo:
              type: string
      - oneOf:
        - properties:
            impostosValor:
              type: 'null'
            impostosTipo:
              type: 'null'
        - properties:
            impostosValor:
              type: string
            impostosTipo:
              type: string
      - if:
          properties:
            impostosTipo:
              const: VALOR
        then:
          properties:
            impostosValor:
              $ref: '#/components/schemas/Dinheiro'
      - oneOf:
        - properties:
            comissaoValor:
              type: 'null'
            comissaoTipo:
              type: 'null'
        - properties:
            comissaoValor:
              type: string
            comissaoTipo:
              type: string
      - if:
          properties:
            comissaoTipo:
              const: VALOR
        then:
          properties:
            comissaoValor:
              $ref: '#/components/schemas/Dinheiro'
    HistoricoPrecificacao:
      type: object
      additionalProperties: false
      required:
      - id
      - itemId
      - tenantId
      - autorId
      - gravadoEm
      - unidade
      - periodicidade
      - valores
      properties:
        id: *id001
        itemId: *id001
        tenantId: *id001
        autorId: *id001
        gravadoEm:
          type: string
          format: date-time
        unidade:
          $ref: '#/components/schemas/Unidade'
        periodicidade:
          $ref: '#/components/schemas/Periodicidade'
        valores:
          $ref: '#/components/schemas/Precificacao'
      description: Uma linha imutável por gravação bem-sucedida, inclusive sem alteração de valores; estado e histórico
        na mesma transação.
    Auxiliar:
      type: object
      additionalProperties: false
      required:
      - id
      - nome
      - ativo
      properties:
        id: *id001
        nome:
          type: string
          minLength: 1
        ativo:
          type: boolean
    NovoAuxiliar:
      type: object
      additionalProperties: false
      required:
      - nome
      properties:
        nome:
          type: string
          minLength: 1
        ativo:
          type: boolean
          default: true
    EditarAuxiliar:
      type: object
      additionalProperties: false
      required: []
      properties:
        nome:
          type: string
          minLength: 1
        ativo:
          type: boolean
      minProperties: 1
    Saude:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
    PaginaItens:
      type: object
      additionalProperties: false
      required:
      - itens
      - pagina
      - tamanho
      - total
      properties:
        itens:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Item'
        pagina:
          type: integer
          minimum: 0
        tamanho:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    PaginaHistorico:
      type: object
      additionalProperties: false
      required:
      - itens
      - pagina
      - tamanho
      - total
      properties:
        itens:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/HistoricoPrecificacao'
        pagina:
          type: integer
          minimum: 0
        tamanho:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    PaginaAuxiliares:
      type: object
      additionalProperties: false
      required:
      - itens
      - pagina
      - tamanho
      - total
      properties:
        itens:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Auxiliar'
        pagina:
          type: integer
          minimum: 0
        tamanho:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    PaginaBusca:
      type: object
      additionalProperties: false
      required:
      - itens
      - pagina
      - tamanho
      - total
      properties:
        itens:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ResultadoBusca'
        pagina:
          type: integer
          minimum: 0
        tamanho:
          type: integer
          minimum: 1
          maximum: 5
        total:
          type: integer
          minimum: 0
