        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    put:
      tags:
      - precificacao
      operationId: gravarPrecificacaoProduto
      summary: Gravar valores sem recálculo
      description: Exige `produtos.precificacao.editar`. Substituição completa. Uma linha de histórico por gravação,
        atomicamente. Não muda outros campos por fórmulas. Autor é sub do JWT; escrita restrita a usuário humano.
      x-permissao: produtos.precificacao.editar
      parameters:
      - $ref: '#/components/parameters/TenantServico'
      - *id002
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/Precificacao'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraViolada'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Precificacao'
  /api/produtos/itens/{id}/precificacao/historico:
    get:
      tags:
      - precificacao
      operationId: listarHistoricoProduto
      summary: Consultar snapshots da precificação
      description: 'Exige `produtos.precificacao.ver`. '
      x-permissao: produtos.precificacao.ver
      parameters:
      - $ref: '#/components/parameters/TenantServico'
      - *id002
      - $ref: '#/components/parameters/Pagina'
      - name: tamanho
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: ordenar
        in: query
        description: Desempate por id.
        schema:
          type: string
          enum:
          - gravadoEm,asc
          - gravadoEm,desc
          default: gravadoEm,desc
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/PaginaHistorico'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /api/produtos/fabricantes:
