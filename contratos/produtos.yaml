      operationId: criarFabricante
      summary: Cadastrar fabricante
      description: 'Exige `produtos.item.criar`. '
      x-permissao: produtos.item.criar
      parameters:
      - $ref: '#/components/parameters/TenantServico'
      responses:
        '201':
          description: Operação concluída
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/Auxiliar'
          headers:
            Location:
              description: URI do recurso criado
              schema:
                type: string
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
      requestBody:
        required: true
