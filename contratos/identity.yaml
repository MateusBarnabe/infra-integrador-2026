openapi: 3.1.0
info:
  title: Identity — Plataforma e Controle de Usuários
  version: 0.3.0
  summary: Endpoints do serviço de identidade consumidos pela casca e pelos outros módulos.
  description: |
    Contrato das ondas 1, 2 e 3 do Grupo 2. As regras gerais estão no Contrato de Integração:
    autenticação (§4), autorização e equipes (§5), API (§8) e comunicação entre módulos (§9).

    A onda 2 acrescenta convite e recuperação de senha, troca de senha, sessões ativas,
    "minha conta" e a administração de usuários, perfis e equipes. Essas rotas de administração
    existem para a casca; os módulos continuam lendo tudo do token (Contrato §5.2).

    A onda 3 acrescenta as notificações do usuário (RF54), a consulta e a exportação da
    auditoria (RF50), o fim da sessão na resposta de login e renovação (RF41) e o resolver de
    tenant por subdomínio para a superfície pública (RF31).

    Códigos de regra de negócio (422) e de conflito (409) vêm em `errors[].codigo`:
    `EMAIL_EM_USO`, `NOME_EM_USO`, `SENHA_FRACA`, `SENHA_ATUAL_INCORRETA`, `LINK_INVALIDO`,
    `AUTOPROTECAO`, `ULTIMO_ADMINISTRADOR`, `PERMISSAO_NAO_CONCEDIVEL`, `PERFIL_INEXISTENTE`,
    `EQUIPE_INEXISTENTE`, `USUARIO_INEXISTENTE`, `PERMISSAO_INEXISTENTE`, `PERFIL_DE_SISTEMA`,
    `PERFIL_EM_USO`, `USUARIO_INATIVO`, `CONVITE_DESNECESSARIO`, `PERIODO_INVALIDO`,
    `LIMITE_DE_EXPORTACAO`.

    Toda resposta usa o envelope `{ success, data, message, errors }`, com duas exceções:
    o JWKS segue o formato padrão da RFC 7517, para que o Spring o leia sem configuração, e o
    sucesso da exportação da auditoria é o próprio arquivo CSV (Contrato §8.2).

    Este serviço **não** pode ser substituído por stub gerado deste arquivo: um JWT de
    exemplo não tem assinatura válida. Em desenvolvimento, use a imagem real do identity com
    os usuários de `docs/usuarios-de-teste.md`.
  contact:
    name: Grupo 2 — Plataforma e Controle de Usuários
    url: https://github.com/karolAlbuquerque/plataforma-integrador-2026-2
  license:
    name: Uso acadêmico — Projeto Integrador 2026
    identifier: LicenseRef-Academico
servers:
  - url: http://localhost:8080
    description: Navegador, pelo gateway, em desenvolvimento
  - url: http://identity:8081
    description: Outro serviço, direto pela rede do Docker
tags:
  - name: autenticacao
    description: Login, renovação e encerramento de sessão
  - name: senha
    description: Convite, recuperação e troca de senha
  - name: conta
    description: Dados e sessões do próprio usuário
  - name: usuarios
    description: Administração de usuários (casca)
  - name: perfis
    description: Perfis e o catálogo de permissões (casca)
  - name: equipes
    description: Equipes de usuários
  - name: servico
    description: Token para rotinas sem usuário
  - name: chaves
    description: Chave pública para validar o JWT
  - name: plataforma
    description: Registro de módulos, equipes e timeline
  - name: notificacoes
    description: Notificações do próprio usuário (casca)
  - name: auditoria
    description: Consulta e exportação da auditoria de acesso (casca)
  - name: saude
    description: Estado do serviço

paths:
  /api/identity/auth/login:
    post:
      tags: [autenticacao]
      operationId: entrar
      summary: Entrar com e-mail e senha
      description: |
        Devolve o access token no corpo e grava o refresh token num cookie `HttpOnly`,
        `Secure` e `SameSite=Strict`, restrito a `/api/identity/auth`. Credencial inválida,
        usuário inativo e e-mail inexistente respondem todos 401 com a mesma mensagem.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credenciais' }
      responses:
        '200':
          description: Sessão aberta
          headers:
            Set-Cookie:
              description: Refresh token, válido por 8 horas
              schema: { type: string, example: 'refresh_token=d41f8c...; HttpOnly; Secure; SameSite=Strict; Path=/api/identity/auth; Max-Age=28800' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/SessaoAberta' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '429': { $ref: '#/components/responses/MuitasTentativas' }

  /api/identity/auth/refresh:
    post:
      tags: [autenticacao]
      operationId: renovarSessao
      summary: Trocar o refresh token por um novo access token
      description: O navegador envia o cookie sozinho. O refresh usado é revogado e um novo cookie é gravado.
      security:
        - cookieRefresh: []
      responses:
        '200':
          description: Sessão renovada
          headers:
            Set-Cookie:
              description: Novo refresh token
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/SessaoAberta' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /api/identity/auth/logout:
    post:
      tags: [autenticacao]
      operationId: sair
      summary: Encerrar a sessão
      description: Revoga o refresh token desta sessão, ou de todas, e apaga o cookie.
      security:
        - cookieRefresh: []
      parameters:
        - name: todas
          in: query
          description: Encerrar todas as sessões do usuário
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Sessão encerrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /api/identity/auth/me:
    get:
      tags: [autenticacao]
      operationId: quemSouEu
      summary: Usuário, tenant, perfis, permissões e equipes do token atual
      responses:
        '200':
          description: Dados da sessão
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Eu' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /api/identity/auth/token-servico:
    post:
      tags: [servico]
      operationId: emitirTokenDeServico
      summary: Emitir token para rotina sem usuário
      description: |
        O token tem `sub = svc:{modulo}` e não carrega `tenant_id`. Nas chamadas feitas com ele,
        o tenant vai no cabeçalho `X-Tenant-Id` (Contrato §9.2). Emissão e uso são auditados.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredencialDeServico' }
      responses:
        '200':
          description: Token emitido
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/TokenDeServico' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /api/identity/auth/senha/recuperar:
    post:
      tags: [senha]
      operationId: pedirRecuperacaoDeSenha
      summary: Pedir o link de recuperação de senha por e-mail
      description: |
        Responde sempre 200, com a mesma mensagem e no mesmo tempo, exista o e-mail ou não. O
        link vale 30 minutos e é de uso único. Pedidos repetidos para o mesmo e-mail ou do mesmo
        IP são ignorados em silêncio além de um limite (a resposta não muda).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoDeRecuperacao' }
      responses:
        '200':
          description: Pedido recebido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              example: { success: true, data: null, message: 'Se o e-mail estiver cadastrado, enviaremos um link em instantes.', errors: [] }
        '400': { $ref: '#/components/responses/DadosInvalidos' }

  /api/identity/auth/senha/verificar:
    post:
      tags: [senha]
      operationId: verificarLinkDeSenha
      summary: Conferir um link de convite ou de recuperação antes de mostrar o formulário
      description: |
        O token vai no corpo, nunca na URL: a casca o lê do fragmento (`/definir-senha#token=…`),
        que o navegador não envia ao servidor. Não consome o token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenDeSenha' }
      responses:
        '200':
          description: Link válido
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/LinkDeSenha' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '422': { $ref: '#/components/responses/RegraDeNegocio' }

  /api/identity/auth/senha/definir:
    post:
      tags: [senha]
      operationId: definirSenha
      summary: Definir a senha pelo link de convite ou de recuperação
      description: |
        Consome o token, cancela os outros links pendentes do usuário e encerra todas as sessões
        abertas. Não abre sessão: a pessoa entra em seguida pela tela de login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DefinicaoDeSenha' }
      responses:
        '200':
          description: Senha definida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '422': { $ref: '#/components/responses/RegraDeNegocio' }

  /api/identity/auth/senha:
    post:
      tags: [senha]
      operationId: trocarSenha
      summary: Trocar a própria senha
      description: |
        Exige a senha atual, mesmo com a sessão válida. Mantém só a sessão do cookie que fez a
        troca e encerra as demais. Cinco senhas atuais erradas em 15 minutos bloqueiam como no
        login (429).
      security:
        - bearerJwt: []
          cookieRefresh: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrocaDeSenha' }
      responses:
        '200':
          description: Senha trocada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '422': { $ref: '#/components/responses/RegraDeNegocio' }
        '429': { $ref: '#/components/responses/MuitasTentativas' }

  /api/identity/auth/sessoes:
    get:
      tags: [conta]
      operationId: listarMinhasSessoes
      summary: Sessões abertas do próprio usuário
      description: A sessão do cookie desta requisição vem marcada com `atual`.
      security:
        - bearerJwt: []
          cookieRefresh: []
      responses:
        '200':
          description: Sessões
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Sessao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
    delete:
      tags: [conta]
      operationId: encerrarOutrasSessoes
      summary: Encerrar todas as sessões, menos a atual
      security:
        - bearerJwt: []
          cookieRefresh: []
      responses:
        '200':
          description: Sessões encerradas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /api/identity/auth/sessoes/{id}:
    delete:
      tags: [conta]
      operationId: encerrarSessao
      summary: Encerrar uma sessão do próprio usuário
      description: A próxima renovação daquele dispositivo falha. Sessão de outro usuário responde 404.
      parameters:
        - $ref: '#/components/parameters/IdNoCaminho'
      responses:
        '200':
          description: Sessão encerrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/identity/conta:
    get:
      tags: [conta]
      operationId: minhaConta
      summary: Dados do próprio usuário
      responses:
        '200':
          description: Conta
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Conta' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
    put:
      tags: [conta]
      operationId: editarMinhaConta
      summary: Editar nome e telefone
      description: E-mail, perfis e equipes não mudam por aqui — só por um administrador.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdicaoDeConta' }
      responses:
        '200':
          description: Conta atualizada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Conta' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /api/identity/.well-known/jwks.json:
    get:
      tags: [chaves]
      operationId: chavesPublicas
      summary: Chave pública para validar o JWT (RFC 7517, sem envelope)
      security: []
      responses:
        '200':
          description: Conjunto de chaves
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jwks' }

  /api/identity/modulos:
    get:
      tags: [plataforma]
      operationId: listarModulosDoMenu
      summary: Módulos e submenus que o usuário atual pode ver
      description: Já filtrado pela `permissaoMenu` de cada módulo e pela permissão de cada item (Contrato §11).
      responses:
        '200':
          description: Menu do usuário
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ModuloDoMenu' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /api/identity/usuarios:
    get:
      tags: [usuarios]
      operationId: listarUsuarios
      summary: Usuários do tenant, com busca, filtros e ordenação
      description: Exige `identity.usuario.ver`. Nunca traz usuário de outro tenant (RF17).
      parameters:
        - name: busca
          in: query
          description: Trecho do nome ou do e-mail
          schema: { type: string, maxLength: 100 }
        - name: perfilId
          in: query
          schema: { type: string, format: uuid }
        - name: situacao
          in: query
          schema: { $ref: '#/components/schemas/SituacaoDoUsuario' }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
        - name: ordenar
          in: query
          description: Campo e direção
          schema:
            type: string
            enum: ['nome,asc', 'nome,desc', 'email,asc', 'email,desc', 'ultimoLoginEm,asc', 'ultimoLoginEm,desc', 'criadoEm,asc', 'criadoEm,desc']
            default: 'nome,asc'
      responses:
        '200':
          description: Página de usuários
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Pagina'
                          - properties:
                              itens:
                                type: array
                                items: { $ref: '#/components/schemas/UsuarioDaLista' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      tags: [usuarios]
      operationId: cadastrarUsuario
      summary: Cadastrar usuário e enviar o convite de primeiro acesso
      description: |
        Exige `identity.usuario.administrar`. O usuário nasce sem senha e define a própria pelo
        link do convite, válido por 72 horas (RF13, RF14). Só se atribui perfil cujas permissões
        quem cadastra já tem (`PERMISSAO_NAO_CONCEDIVEL`). `conviteEnviado` é falso quando o
        SMTP falhou — o cadastro vale e o convite pode ser reenviado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastroDeUsuario' }
      responses:
        '201':
          description: Usuário cadastrado
          headers:
            Location:
              schema: { type: string, example: /api/identity/usuarios/9f1c4e2a-6b1d-4c1e-9a55-2d3e4f5a6b7c }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/UsuarioSalvo' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/RegraDeNegocio' }

  /api/identity/usuarios/{id}:
    get:
      tags: [usuarios]
      operationId: detalharUsuario
      summary: Um usuário, com perfis, equipes e convite pendente
      description: Exige `identity.usuario.ver`.
      parameters:
        - $ref: '#/components/parameters/IdNoCaminho'
      responses:
        '200':
          description: Usuário
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/UsuarioDetalhe' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    put:
      tags: [usuarios]
      operationId: editarUsuario
      summary: Editar dados, perfis e equipes
      description: |
        Exige `identity.usuario.administrar`. Perfil retirado deixa de valer na próxima renovação
        do token (RF15). Não se altera os próprios perfis (`AUTOPROTECAO`) nem se deixa o tenant sem
        administrador (`ULTIMO_ADMINISTRADOR`). Trocar o e-mail de quem tem convite pendente
        reenvia o convite para o endereço novo.
      parameters:
        - $ref: '#/components/parameters/IdNoCaminho'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastroDeUsuario' }
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/UsuarioSalvo' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/RegraDeNegocio' }

  /api/identity/usuarios/{id}/desativar:
    post:
      tags: [usuarios]
      operationId: desativarUsuario
      summary: Desativar usuário (nunca excluir)
      description: |
        Exige `identity.usuario.administrar`. Bloqueia o login na hora, encerra as sessões e
        cancela o convite pendente (RF16). O histórico e a autoria dos registros continuam.
      parameters:
        - $ref: '#/components/parameters/IdNoCaminho'
      responses:
        '200': { $ref: '#/components/responses/UsuarioSalvo' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/RegraDeNegocio' }

  /api/identity/usuarios/{id}/reativar:
    post:
      tags: [usuarios]
      operationId: reativarUsuario
      summary: Reativar usuário
      description: Exige `identity.usuario.administrar`. Quem nunca definiu senha recebe um convite novo.
      parameters:
        - $ref: '#/components/parameters/IdNoCaminho'
      responses:
        '200': { $ref: '#/components/responses/UsuarioSalvo' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/RegraDeNegocio' }

  /api/identity/usuarios/{id}/convite:
    post:
      tags: [usuarios]
      operationId: reenviarConvite
      summary: Reenviar o convite de primeiro acesso
      description: |
        Exige `identity.usuario.administrar`. Cancela o convite anterior. Usuário que já definiu
        senha (`CONVITE_DESNECESSARIO`) ou inativo (`USUARIO_INATIVO`) responde 422.
      parameters:
        - $ref: '#/components/parameters/IdNoCaminho'
      responses:
        '200': { $ref: '#/components/responses/UsuarioSalvo' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/RegraDeNegocio' }

  /api/identity/permissoes:
    get:
      tags: [perfis]
      operationId: listarCatalogoDePermissoes
      summary: Catálogo global de permissões, agrupado por módulo
      description: |
        Exige `identity.perfil.ver`. Alimenta a matriz de montagem de perfis (RF22). É a única
        listagem sem paginação: o catálogo é global, limitado e precisa aparecer inteiro numa tela.
      responses:
        '200':
          description: Catálogo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PermissoesDoModulo' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/identity/perfis:
    get:
      tags: [perfis]
      operationId: listarPerfis
      summary: Perfis do tenant
      description: Exige `identity.perfil.ver` ou `identity.usuario.administrar` (para o formulário de usuário).
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - name: tamanho
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: Página de perfis — os de sistema primeiro, depois por nome
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Pagina'
                          - properties:
                              itens:
                                type: array
                                items: { $ref: '#/components/schemas/PerfilResumo' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      tags: [perfis]
      operationId: criarPerfil
      summary: Criar perfil personalizado
      description: |
        Exige `identity.perfil.administrar`. Só entram permissões que quem cria já tem
        (`PERMISSAO_NAO_CONCEDIVEL`). Nome único no tenant, sem diferença de maiúsculas.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastroDePerfil' }
      responses:
        '201':
          description: Perfil criado
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/PerfilDetalhe' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/RegraDeNegocio' }

  /api/identity/perfis/{id}:
    get:
      tags: [perfis]
      operationId: detalharPerfil
      summary: Um perfil e as suas permissões
      description: Exige `identity.perfil.ver`.
      parameters:
        - $ref: '#/components/parameters/IdNoCaminho'
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/PerfilDetalhe' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    put:
      tags: [perfis]
      operationId: editarPerfil
      summary: Editar nome, descrição e permissões, numa gravação só
      description: |
        Exige `identity.perfil.administrar`. A lista de permissões substitui a anterior; a
        diferença vai para a auditoria (RF26). Perfil de sistema não muda de nome
        (`PERFIL_DE_SISTEMA`). Mudança que deixe o tenant sem administrador é recusada
        (`ULTIMO_ADMINISTRADOR`). Vale na próxima renovação do token de quem tem o perfil.
      parameters:
        - $ref: '#/components/parameters/IdNoCaminho'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastroDePerfil' }
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/PerfilDetalhe' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/RegraDeNegocio' }
    delete:
      tags: [perfis]
      operationId: excluirPerfil
      summary: Excluir perfil personalizado sem usuários
      description: |
        Exige `identity.perfil.administrar`. Perfil de sistema (`PERFIL_DE_SISTEMA`) e perfil
        com usuários (`PERFIL_EM_USO`) não são excluídos.
      parameters:
        - $ref: '#/components/parameters/IdNoCaminho'
      responses:
        '200':
          description: Perfil excluído
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/RegraDeNegocio' }

  /api/identity/perfis/{id}/duplicar:
    post:
      tags: [perfis]
      operationId: duplicarPerfil
      summary: Criar um perfil personalizado a partir de outro
      description: Exige `identity.perfil.administrar`. Copia as permissões; a cópia nunca é de sistema.
      parameters:
        - $ref: '#/components/parameters/IdNoCaminho'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome]
              properties:
                nome: { type: string, minLength: 1, maxLength: 60, example: Vendedor sênior }
      responses:
        '201':
          description: Cópia criada
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/PerfilDetalhe' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/RegraDeNegocio' }

  /api/identity/equipes:
    get:
      tags: [equipes]
      operationId: listarEquipes
      summary: Equipes do tenant
      description: Exige `identity.equipe.ver_resumo` — os módulos usam para filtros por equipe.
      parameters:
        - name: busca
          in: query
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página de equipes, em ordem de nome
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Pagina'
                          - properties:
                              itens:
                                type: array
                                items: { $ref: '#/components/schemas/EquipeResumo' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      tags: [equipes]
      operationId: criarEquipe
      summary: Criar equipe com membros e líderes
      description: Exige `identity.equipe.administrar`. Quem entra passa a ter a equipe no token na próxima renovação (RF57).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastroDeEquipe' }
      responses:
        '201':
          description: Equipe criada
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/EquipeDetalhe' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/RegraDeNegocio' }

  /api/identity/equipes/{id}:
    get:
      tags: [equipes]
      operationId: detalharEquipe
      summary: Uma equipe e os seus membros
      description: Exige `identity.equipe.ver_resumo`.
      parameters:
        - $ref: '#/components/parameters/IdNoCaminho'
      responses:
        '200':
          description: Equipe
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/EquipeDetalhe' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    put:
      tags: [equipes]
      operationId: editarEquipe
      summary: Renomear e trocar membros e líderes
      description: Exige `identity.equipe.administrar`. A lista de membros substitui a anterior.
      parameters:
        - $ref: '#/components/parameters/IdNoCaminho'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastroDeEquipe' }
      responses:
        '200':
          description: Equipe atualizada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/EquipeDetalhe' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/RegraDeNegocio' }
    delete:
      tags: [equipes]
      operationId: excluirEquipe
      summary: Excluir equipe
      description: |
        Exige `identity.equipe.administrar`. Exclusão lógica: a equipe sai do token dos membros na
        próxima renovação; registros de módulos que guardam o `equipe_id` continuam com o UUID.
      parameters:
        - $ref: '#/components/parameters/IdNoCaminho'
      responses:
        '200':
          description: Equipe excluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/identity/equipes/{id}/membros:
    get:
      tags: [plataforma]
      operationId: listarMembrosDaEquipe
      summary: Membros de uma equipe, para escolher responsável
      description: Exige `identity.equipe.ver_resumo`. Equipe de outro tenant responde 404 (Contrato §5.4).
      parameters:
        - $ref: '#/components/parameters/IdNoCaminho'
      responses:
        '200':
          description: Membros
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/MembroDeEquipe' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/identity/eventos:
    get:
      tags: [plataforma]
      operationId: listarTimelineDaEmpresa
      summary: Timeline de uma empresa, do fato mais recente para o mais antigo
      description: |
        Os registros chegam pela mensagem `identity.timeline.registrar` (ver identity.asyncapi.yaml).
        Exige `identity.timeline.ver`.
      parameters:
        - name: empresaId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página da timeline
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Pagina'
                          - properties:
                              itens:
                                type: array
                                items: { $ref: '#/components/schemas/EventoDaTimeline' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  # ---------------------------------------------------------------- onda 3: notificações

  /api/identity/notificacoes:
    get:
      tags: [notificacoes]
      operationId: listarNotificacoes
      summary: Notificações do usuário do token, da mais recente para a mais antiga
      description: |
        Só as do próprio usuário, no tenant do token (RF54). Token de serviço responde 403.
        As notificações chegam pela mensagem `identity.notificacao.criar` (identity.asyncapi.yaml).
      parameters:
        - name: naoLidas
          in: query
          description: Só as ainda não lidas
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página de notificações
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Pagina'
                          - properties:
                              itens:
                                type: array
                                items: { $ref: '#/components/schemas/Notificacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/identity/notificacoes/contagem:
    get:
      tags: [notificacoes]
      operationId: contarNotificacoesNaoLidas
      summary: Quantas notificações o usuário ainda não leu
      description: Consulta leve, feita pela casca a cada 30 segundos para o contador do sino.
      responses:
        '200':
          description: Contagem
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/ContagemDeNotificacoes' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/identity/notificacoes/{id}/lida:
    post:
      tags: [notificacoes]
      operationId: marcarNotificacaoComoLida
      summary: Marcar uma notificação como lida
      description: Idempotente — marcar de novo não muda a data da primeira leitura. Notificação de outro usuário responde 404.
      parameters:
        - $ref: '#/components/parameters/IdNoCaminho'
      responses:
        '200':
          description: Marcada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/identity/notificacoes/lidas:
    post:
      tags: [notificacoes]
      operationId: marcarTodasComoLidas
      summary: Marcar todas as notificações do usuário como lidas
      responses:
        '200':
          description: Quantas foram marcadas agora
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        required: [marcadas]
                        properties:
                          marcadas: { type: integer, example: 3 }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  # ---------------------------------------------------------------- onda 3: auditoria

  /api/identity/auditoria:
    get:
      tags: [auditoria]
      operationId: consultarAuditoria
      summary: Registros de auditoria do tenant, do mais recente para o mais antigo
      description: |
        Exige `identity.auditoria.ver` (RF50). Só registros do tenant do token: tentativas com
        e-mail inexistente e emissões de token de serviço não têm tenant e ficam fora da consulta.
        Para responder "quem deu esta permissão a este usuário, e quando" (RF26), filtre
        `entidade=usuario_perfis` e `entidadeId` com o id do usuário.
      parameters:
        - $ref: '#/components/parameters/FiltroAuditoriaUsuario'
        - $ref: '#/components/parameters/FiltroAuditoriaAcao'
        - $ref: '#/components/parameters/FiltroAuditoriaEntidade'
        - $ref: '#/components/parameters/FiltroAuditoriaEntidadeId'
        - $ref: '#/components/parameters/FiltroAuditoriaDe'
        - $ref: '#/components/parameters/FiltroAuditoriaAte'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página da auditoria
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Pagina'
                          - properties:
                              itens:
                                type: array
                                items: { $ref: '#/components/schemas/RegistroDeAuditoria' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/identity/auditoria/exportar:
    get:
      tags: [auditoria]
      operationId: exportarAuditoria
      summary: Exportar em CSV o resultado dos mesmos filtros da consulta
      description: |
        Exige `identity.auditoria.exportar`. O sucesso é o próprio arquivo, fora do envelope
        (Contrato §8.2): UTF-8 com BOM, separador `;`, uma linha por registro, no máximo
        10 000 linhas — acima disso responde 422 `LIMITE_DE_EXPORTACAO` para estreitar o período.
        Os erros continuam no envelope. A exportação fica registrada na própria auditoria.
      parameters:
        - $ref: '#/components/parameters/FiltroAuditoriaUsuario'
        - $ref: '#/components/parameters/FiltroAuditoriaAcao'
        - $ref: '#/components/parameters/FiltroAuditoriaEntidade'
        - $ref: '#/components/parameters/FiltroAuditoriaEntidadeId'
        - $ref: '#/components/parameters/FiltroAuditoriaDe'
        - $ref: '#/components/parameters/FiltroAuditoriaAte'
      responses:
        '200':
          description: Arquivo CSV
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="auditoria-2026-09-22.csv"' }
          content:
            text/csv:
              schema:
                type: string
                example: |
                  ocorridoEm;usuario;usuarioId;ip;acao;entidade;entidadeId;valorAnterior;valorNovo
                  2026-09-22T14:03:11Z;Administrador da Empresa A;9f1c…;203.0.113.7;alterar;usuario_perfis;7b1e…;{"perfis":["VENDEDOR"]};{"perfis":["VENDEDOR","GESTOR"]}
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '422': { $ref: '#/components/responses/RegraDeNegocio' }

  # ---------------------------------------------------------------- onda 3: superfície pública

  /api/identity/tenants/resolver:
    get:
      tags: [servico]
      operationId: resolverTenantPorSubdominio
      summary: Descobrir o tenant de uma página pública pelo subdomínio
      description: |
        Para a superfície pública (RF31, Contrato §12.6): o módulo que serve a página recebe o
        subdomínio do endereço acessado e pergunta aqui a qual tenant ele pertence, com o
        próprio token de serviço. Exige `identity.tenant.ver`, concedida por `servicos` no
        catálogo. Subdomínio desconhecido ou tenant inativo responde 404. Quem resolve pelo
        *slug* da página é o próprio módulo dono dela.
      parameters:
        - name: subdominio
          in: query
          required: true
          schema: { type: string, pattern: '^[a-z0-9-]{1,63}$', example: centinela }
      responses:
        '200':
          description: Tenant ativo com esse subdomínio
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/TenantResolvido' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/identity/health:
    get:
      tags: [saude]
      operationId: saude
      summary: Serviço de pé e conectado ao banco
      security: []
      responses:
        '200':
          description: Disponível
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespostaDeSaude' }
        '503':
          description: Indisponível
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

security:
  - bearerJwt: []

components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token RS256, de 15 minutos, emitido por este serviço.
    cookieRefresh:
      type: apiKey
      in: cookie
      name: refresh_token

  parameters:
    IdNoCaminho:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Pagina:
      name: pagina
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Tamanho:
      name: tamanho
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    FiltroAuditoriaUsuario:
      name: usuarioId
      in: query
      description: Quem agiu
      schema: { type: string, format: uuid }
    FiltroAuditoriaAcao:
      name: acao
      in: query
      schema: { $ref: '#/components/schemas/AcaoAuditada' }
    FiltroAuditoriaEntidade:
      name: entidade
      in: query
      schema: { $ref: '#/components/schemas/EntidadeAuditada' }
    FiltroAuditoriaEntidadeId:
      name: entidadeId
      in: query
      description: O registro afetado
      schema: { type: string, format: uuid }
    FiltroAuditoriaDe:
      name: de
      in: query
      description: Início do período, inclusive
      schema: { type: string, format: date-time, example: '2026-09-01T00:00:00-03:00' }
    FiltroAuditoriaAte:
      name: ate
      in: query
      description: Fim do período, exclusive. Antes de `de` responde 400 `PERIODO_INVALIDO`.
      schema: { type: string, format: date-time, example: '2026-10-01T00:00:00-03:00' }

  responses:
    DadosInvalidos:
      description: Dado inválido; `errors` detalha campo a campo
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example:
            success: false
            data: null
            message: Não foi possível entrar.
            errors:
              - { campo: email, codigo: CAMPO_OBRIGATORIO, detalhe: Informe o e-mail. }
    NaoAutenticado:
      description: Sem token, token inválido, expirado ou credencial recusada
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example: { success: false, data: null, message: E-mail ou senha incorretos., errors: [] }
    SemPermissao:
      description: Autenticado, mas sem a permissão exigida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example: { success: false, data: null, message: Sem permissão para esta operação., errors: [] }
    NaoEncontrado:
      description: Não existe ou pertence a outro tenant
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example: { success: false, data: null, message: Registro não encontrado., errors: [] }
    MuitasTentativas:
      description: Cinco falhas em quinze minutos, por e-mail ou por IP
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example: { success: false, data: null, message: Muitas tentativas. Aguarde 15 minutos., errors: [] }
    Conflito:
      description: Duplicidade — e-mail já usado por outro usuário não excluído, ou nome já usado no tenant
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example:
            success: false
            data: null
            message: Este e-mail já está em uso.
            errors:
              - { campo: email, codigo: EMAIL_EM_USO, detalhe: Este e-mail já está em uso. }
    RegraDeNegocio:
      description: Bem formado, mas viola uma regra; o código está em `errors[].codigo`
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example:
            success: false
            data: null
            message: O tenant ficaria sem administrador.
            errors:
              - { campo: perfis, codigo: ULTIMO_ADMINISTRADOR, detalhe: O tenant ficaria sem administrador. }
    UsuarioSalvo:
      description: Usuário depois da operação
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { $ref: '#/components/schemas/UsuarioSalvo' }

  schemas:
    Envelope:
      type: object
      required: [success, data, message, errors]
      properties:
        success: { type: boolean }
        data: {}
        message: { type: [string, 'null'] }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ErroDeCampo' }

    ErroDeCampo:
      type: object
      required: [campo, codigo, detalhe]
      properties:
        campo: { type: string, example: email }
        codigo: { type: string, example: CAMPO_OBRIGATORIO }
        detalhe: { type: string, example: Informe o e-mail. }

    Pagina:
      type: object
      required: [itens, pagina, tamanho, total]
      properties:
        itens: { type: array, items: {} }
        pagina: { type: integer, example: 0 }
        tamanho: { type: integer, example: 20 }
        total: { type: integer, example: 137 }

    Credenciais:
      type: object
      required: [email, senha]
      properties:
        email: { type: string, format: email, example: vendedor@empresa-a.dev }
        senha: { type: string, format: password, minLength: 8, example: Plataforma2026 }

    Usuario:
      type: object
      required: [id, nome, email, tenantId]
      properties:
        id: { type: string, format: uuid, example: 9f1c4e2a-6b1d-4c1e-9a55-2d3e4f5a6b7c }
        nome: { type: string, example: Vendedor da Empresa A }
        email: { type: string, format: email, example: vendedor@empresa-a.dev }
        tenantId: { type: string, format: uuid, example: a0000000-0000-4000-8000-00000000000a }

    SessaoAberta:
      type: object
      required: [accessToken, expiraEmSegundos, sessaoExpiraEm, usuario]
      properties:
        accessToken: { type: string, example: eyJhbGciOiJSUzI1NiIsImtpZCI6ImRldi0yMDI2In0... }
        expiraEmSegundos: { type: integer, example: 900 }
        sessaoExpiraEm:
          type: string
          format: date-time
          description: |
            Fim da sessão, oito horas depois do login; a renovação não o adia. A casca avisa antes
            e pede a senha de novo sem sair da tela (RF41).
        usuario: { $ref: '#/components/schemas/Usuario' }

    Eu:
      type: object
      required: [usuario, tenant, perfis, permissoes, equipes]
      properties:
        usuario: { $ref: '#/components/schemas/Usuario' }
        tenant:
          type: object
          required: [id, nome]
          properties:
            id: { type: string, format: uuid }
            nome: { type: string, example: Empresa A }
        perfis:
          type: array
          items: { type: string }
          example: [VENDEDOR]
        permissoes:
          type: array
          items: { type: string, pattern: '^[a-z]+\.[a-z_]+\.[a-z_]+$|^[a-z]+\.acessar$' }
          example: [crm.acessar, crm.oportunidade.ver, crm.empresa.ver_resumo]
        equipes:
          type: array
          items: { type: string, format: uuid }

    CredencialDeServico:
      type: object
      required: [clientId, clientSecret]
      properties:
        clientId: { type: string, example: financeiro }
        clientSecret: { type: string, format: password }

    TokenDeServico:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, example: 900 }

    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, kid, use, alg, n, e]
            properties:
              kty: { type: string, example: RSA }
              kid: { type: string, example: dev-2026 }
              use: { type: string, example: sig }
              alg: { type: string, example: RS256 }
              n: { type: string }
              e: { type: string, example: AQAB }

    ModuloDoMenu:
      type: object
      required: [codigo, nome, urlFrontend, prefixoApi, ordemMenu, disponivel, itensSubmenu]
      properties:
        codigo: { type: string, example: crm }
        nome: { type: string, example: CRM }
        icone: { type: string, example: kanban }
        urlFrontend: { type: string, example: /modulos/crm/ }
        prefixoApi: { type: string, example: /api/crm }
        ordemMenu: { type: integer, example: 20 }
        disponivel:
          type: boolean
          description: Resultado do último healthcheck
        itensSubmenu:
          type: array
          items:
            type: object
            required: [rota, nome]
            properties:
              rota: { type: string, example: /funil }
              nome: { type: string, example: Funil }

    MembroDeEquipe:
      type: object
      required: [id, nome, lider]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string, example: Vendedor da Empresa A }
        lider: { type: boolean, example: false }

    EventoDaTimeline:
      type: object
      required: [id, tipo, moduloOrigem, texto, ocorridoEm]
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, example: contratos.contrato.assinado }
        moduloOrigem: { type: string, example: contratos }
        texto: { type: string, example: Contrato CT-0042 assinado por Maria Souza }
        rota: { type: [string, 'null'], example: /modulos/contratos/contratos/7b1e }
        usuarioId: { type: [string, 'null'], format: uuid }
        ocorridoEm: { type: string, format: date-time }

    RespostaDeSaude:
      type: object
      required: [success, data, message, errors]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            status: { type: string, example: UP }
        message: { type: [string, 'null'] }
        errors: { type: array, items: {} }

    # ---------------------------------------------------------------- onda 2: senha e conta

    SenhaNova:
      type: string
      format: password
      minLength: 8
      maxLength: 72
      description: Oito caracteres ou mais, com letra e número; até 72 bytes em UTF-8 (limite do BCrypt). Nunca volta em resposta nem em log (RF09).

    PedidoDeRecuperacao:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }

    TokenDeSenha:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 100, description: Valor lido do fragmento do link }

    LinkDeSenha:
      type: object
      required: [tipo, nome, email, expiraEm]
      properties:
        tipo: { type: string, enum: [convite, recuperacao] }
        nome: { type: string, example: Maria Souza }
        email: { type: string, format: email }
        expiraEm: { type: string, format: date-time }

    DefinicaoDeSenha:
      type: object
      required: [token, novaSenha]
      properties:
        token: { type: string, maxLength: 100 }
        novaSenha: { $ref: '#/components/schemas/SenhaNova' }

    TrocaDeSenha:
      type: object
      required: [senhaAtual, novaSenha]
      properties:
        senhaAtual: { type: string, format: password, maxLength: 72 }
        novaSenha: { $ref: '#/components/schemas/SenhaNova' }

    Sessao:
      type: object
      required: [id, iniciadaEm, ultimaRenovacaoEm, expiraEm, atual]
      properties:
        id: { type: string, format: uuid, description: 'Identificador da sessão, estável entre renovações' }
        ip: { type: [string, 'null'], example: 203.0.113.7 }
        navegador: { type: [string, 'null'], example: Chrome no Windows }
        iniciadaEm: { type: string, format: date-time }
        ultimaRenovacaoEm: { type: string, format: date-time }
        expiraEm: { type: string, format: date-time }
        atual: { type: boolean, description: É a sessão do cookie desta requisição }

    Conta:
      type: object
      required: [id, nome, email, tenant, perfis, equipes]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        email: { type: string, format: email }
        telefone: { type: [string, 'null'] }
        tenant:
          type: object
          required: [id, nome]
          properties:
            id: { type: string, format: uuid }
            nome: { type: string, example: Centinela Soluções }
        perfis:
          type: array
          items: { $ref: '#/components/schemas/PerfilDoUsuario' }
        equipes:
          type: array
          items: { $ref: '#/components/schemas/EquipeDoUsuario' }
        ultimoLoginEm: { type: [string, 'null'], format: date-time }
        criadoEm: { type: string, format: date-time }

    EdicaoDeConta:
      type: object
      required: [nome]
      properties:
        nome: { type: string, minLength: 1, maxLength: 120 }
        telefone: { $ref: '#/components/schemas/Telefone' }

    Telefone:
      type: [string, 'null']
      maxLength: 20
      pattern: '^[0-9()+\- ]{8,20}$'
      example: (62) 99999-0000

    # ---------------------------------------------------------------- onda 2: usuários

    SituacaoDoUsuario:
      type: string
      enum: [ativo, convite_pendente, convite_expirado, inativo]
      description: |
        `ativo` já definiu senha; `convite_pendente` e `convite_expirado` ainda não, com convite
        válido ou vencido; `inativo` foi desativado.

    PerfilDoUsuario:
      type: object
      required: [id, nome, rotulo, sistema]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string, example: PRE_VENDAS, description: Valor que vai no claim roles }
        rotulo: { type: string, example: Pré-vendas }
        sistema: { type: boolean }

    EquipeDoUsuario:
      type: object
      required: [id, nome, lider]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string, example: Comercial }
        lider: { type: boolean }

    UsuarioDaLista:
      type: object
      required: [id, nome, email, situacao, perfis, criadoEm]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        email: { type: string, format: email }
        telefone: { type: [string, 'null'] }
        situacao: { $ref: '#/components/schemas/SituacaoDoUsuario' }
        perfis:
          type: array
          items: { $ref: '#/components/schemas/PerfilDoUsuario' }
        ultimoLoginEm: { type: [string, 'null'], format: date-time }
        criadoEm: { type: string, format: date-time }

    UsuarioDetalhe:
      allOf:
        - $ref: '#/components/schemas/UsuarioDaLista'
        - type: object
          required: [equipes]
          properties:
            equipes:
              type: array
              items: { $ref: '#/components/schemas/EquipeDoUsuario' }
            conviteExpiraEm:
              type: [string, 'null']
              format: date-time
              description: Validade do convite pendente, se houver

    CadastroDeUsuario:
      type: object
      required: [nome, email, perfis]
      properties:
        nome: { type: string, minLength: 1, maxLength: 120, example: Maria Souza }
        email: { type: string, format: email, maxLength: 254, example: maria@centinela.com.br }
        telefone: { $ref: '#/components/schemas/Telefone' }
        perfis:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        equipes:
          type: array
          uniqueItems: true
          description: Equipes de que participa. Quem já era membro continua com a marcação de líder; quem entra, entra como membro comum.
          items: { type: string, format: uuid }

    UsuarioSalvo:
      type: object
      required: [usuario, conviteEnviado]
      properties:
        usuario: { $ref: '#/components/schemas/UsuarioDetalhe' }
        conviteEnviado:
          type: [boolean, 'null']
          description: Nulo quando a operação não envolveu convite; falso quando o e-mail não pôde ser enviado

    # ---------------------------------------------------------------- onda 2: perfis e equipes

    PermissaoDoCatalogo:
      type: object
      required: [codigo, recurso, acao, descricao]
      properties:
        codigo: { type: string, example: crm.oportunidade.editar }
        recurso: { type: string, example: oportunidade, description: 'É "modulo" em {modulo}.acessar' }
        acao: { type: string, example: editar }
        descricao: { type: string }

    PermissoesDoModulo:
      type: object
      required: [modulo, nome, permissoes]
      properties:
        modulo: { type: string, example: crm }
        nome: { type: string, example: CRM, description: 'Nome do registro do módulo, ou o código se não houver registro' }
        permissoes:
          type: array
          items: { $ref: '#/components/schemas/PermissaoDoCatalogo' }

    PerfilResumo:
      type: object
      required: [id, nome, rotulo, sistema, totalUsuarios, totalPermissoes]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string, example: VENDEDOR }
        rotulo: { type: string, example: Vendedor }
        descricao: { type: [string, 'null'] }
        sistema: { type: boolean, description: Um dos dez perfis iniciais; não exclui nem muda de nome }
        totalUsuarios: { type: integer }
        totalPermissoes: { type: integer }

    PerfilDetalhe:
      type: object
      required: [id, nome, rotulo, sistema, totalUsuarios, permissoes]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        rotulo: { type: string }
        descricao: { type: [string, 'null'] }
        sistema: { type: boolean }
        totalUsuarios: { type: integer }
        permissoes:
          type: array
          items: { type: string, example: crm.oportunidade.ver }

    CadastroDePerfil:
      type: object
      required: [nome, permissoes]
      properties:
        nome: { type: string, minLength: 1, maxLength: 60, example: Vendedor sênior }
        descricao: { type: [string, 'null'], maxLength: 300 }
        permissoes:
          type: array
          uniqueItems: true
          items: { type: string }

    # ---------------------------------------------------------------- onda 3

    Notificacao:
      type: object
      required: [id, categoria, titulo, lida, criadaEm]
      properties:
        id: { type: string, format: uuid }
        categoria: { type: string, example: COBRANCA_VENCIDA, description: Uma das categorias de DadosNotificacao (identity.asyncapi.yaml) }
        titulo: { type: string, example: Cobrança CB-0198 venceu }
        texto: { type: [string, 'null'], example: 'Cliente Alfa Engenharia, R$ 4.200,00' }
        moduloOrigem: { type: [string, 'null'], example: financeiro, description: Nulo nas notificações gravadas antes da onda 3 }
        rota:
          type: [string, 'null']
          example: /cobrancas/7b1e
          description: Relativa ao front do módulo de origem, sem o código (Contrato §12.2); a casca abre `/app/{moduloOrigem}{rota}`.
        lida: { type: boolean }
        criadaEm: { type: string, format: date-time }

    ContagemDeNotificacoes:
      type: object
      required: [naoLidas]
      properties:
        naoLidas: { type: integer, example: 3 }

    AcaoAuditada:
      type: string
      description: Ações que o identity registra hoje; a lista cresce com novas funcionalidades.
      enum: [login, login_falhou, login_bloqueado, logout, refresh_reutilizado, encerrar_sessao,
             encerrar_outras_sessoes, token_servico, token_servico_recusado, acesso_negado,
             recuperacao_solicitada, recuperacao_ignorada, definir_senha, trocar_senha,
             trocar_senha_recusada, criar, editar, excluir, alterar, convidar, desativar, reativar,
             exportar]

    EntidadeAuditada:
      type: string
      enum: [sessao, credencial_servico, senha, usuario, usuario_perfis, usuario_equipes, perfil,
             perfil_permissoes, equipe, equipe_membros, rota, auditoria]

    RegistroDeAuditoria:
      type: object
      required: [id, ocorridoEm, acao, entidade]
      properties:
        id: { type: string, format: uuid }
        ocorridoEm: { type: string, format: date-time }
        usuario:
          description: Quem agiu; nulo quando não há usuário identificado (ex. link de recuperação)
          oneOf:
            - type: 'null'
            - type: object
              required: [id, nome]
              properties:
                id: { type: string, format: uuid }
                nome: { type: string, example: Administrador da Empresa A }
        ip: { type: [string, 'null'], example: 203.0.113.7 }
        acao: { $ref: '#/components/schemas/AcaoAuditada' }
        entidade: { $ref: '#/components/schemas/EntidadeAuditada' }
        entidadeId: { type: [string, 'null'], format: uuid }
        valorAnterior: { type: [object, 'null'], example: { perfis: [VENDEDOR] } }
        valorNovo: { type: [object, 'null'], example: { perfis: [VENDEDOR, GESTOR] } }

    TenantResolvido:
      type: object
      required: [id, nome]
      properties:
        id: { type: string, format: uuid, example: 00000000-0000-4000-8000-000000000001 }
        nome: { type: string, example: Centinela Soluções, description: 'Nome fantasia, ou a razão social se não houver' }

    EquipeResumo:
      type: object
      required: [id, nome, totalMembros, lideres]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string, example: Comercial }
        totalMembros: { type: integer }
        lideres:
          type: array
          items: { type: string, example: Gestor da Empresa A }

    EquipeDetalhe:
      type: object
      required: [id, nome, membros]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        membros:
          type: array
          description: Sem e-mail — `identity.equipe.ver_resumo` é dado a quase todos os perfis operacionais.
          items: { $ref: '#/components/schemas/MembroDeEquipe' }

    CadastroDeEquipe:
      type: object
      required: [nome, membros]
      properties:
        nome: { type: string, minLength: 1, maxLength: 80, example: Comercial }
        membros:
          type: array
          items:
            type: object
            required: [usuarioId, lider]
            properties:
              usuarioId: { type: string, format: uuid }
              lider: { type: boolean }
